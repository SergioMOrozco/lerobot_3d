# Full TeleopSystemConfig, as YAML. Edit this file to change hardware wiring or run
# settings -- no code changes needed. See lerobot_3d.teleop_config for field docs.

# Robot: so101 (SO101 leader/follower arms on USB) or yam (I2RT YAM station arms over ROS 2).
robot_type: so101

# --- robot_type: yam -- replace leaders/followers/cameras below with, e.g.:
# leaders:
#   - type: keyboard              # end-effector keyboard teleop (keys in yam_preview.yaml); [] only observes
# followers:                      # one entry per arm, 1 or 2, over ROS 2
#   - side: left                  # reads /left/joint_states, commands /left/cmd_joint
#   - side: right                 # override with joint_topic: / command_topic:
# realsense_serials: []
# ros_cameras:                    # RGB-D cameras on ROS 2 topics (also usable with so101, without link)
#   - namespace: /camera/top      # no link: fixed in the world, calibrated like a RealSense camera
#   - namespace: /camera/left_wrist
#     link: left_camera           # moves with this URDF link (wrist camera)
#   - namespace: /camera/right_wrist
#     link: right_camera
#     # Optional per camera: color_topic, depth_topic, color_info_topic, depth_info_topic (relative to
#     # namespace). Point depth_topic/depth_info_topic at depth aligned to color to skip registration.
# With followers: [] the YAM arms are virtual (no ROS): at the URDF rest pose, or driven by the keyboard.

# leaders/followers must be the same length when both are set (one leader drives one
# follower, matched by list position). Each of the three lists below may be empty ([]):
#   leaders: []            -> no teleop; drive the system with system.step(action).
#   followers: []          -> nothing is commanded; the action poses the URDF in viser.
#                             Calibration: robot_calibration_ids/paths, else the first leader's.
#   realsense_serials: []  -> no cameras; the scene point cloud is empty.
# With no leaders AND no followers, num_robots virtual robots are each posed by their own
# entry in system.step([a0, ..., aN-1]) and drawn on a grid in viser.
leaders:
  - port: /dev/ttyACM0
    id: test_leader_arm

followers:
  - port: /dev/ttyACM1
    id: gray_follower_arm

realsense_serials:
  - "044322073544"
  #- "244622072067"

# Virtual robots (only > 1 with leaders: [] and followers: []), and the grid spacing in
# meters between their bases in viser. robot_calibration_ids takes 1 id (shared) or N.
num_robots: 1
robot_grid_spacing: 0.5

# Camera extrinsics JSON (cwd, LEROBOT_3D_EXTRINSIC_JSON, or src/ next to package).
extrinsic_json: extrinsic_calibration.json

# Non-empty -> record episodes into a LeRobotDataset (e.g. local/my_task). In the terminal:
# Enter starts an episode, Space ends it, then y/n keeps or discards it. dataset_root: null
# uses LeRobot's default location (HF_LEROBOT_HOME/<repo_id>); an existing dataset there is
# appended to. The teleop loop runs at dataset_fps while recording is configured.
dataset_repo_id: "Sorozco0612/pusht"
dataset_root: null
dataset_task: teleop
dataset_fps: 15

# null -> the bundled URDF for robot_type under the package's calibration/ dir.
urdf_path: null

# Show the viser GUI's Quit/Capture/Save-subgoal controls.
tune: true

# After Capture, click-segment the robot per camera with SAM2 (left-click robot, right-click
# background, Enter to save) -> calibration_files/<serial>/mask.png. Needs the segment extra.
segment_on_capture: true
sam2_model_id: facebook/sam2.1-hiera-large

# Viser point radius in world-space meters (not pixels) -- e.g. 0.003 = 3mm dots.
point_size: 0.003

# RealSense color/depth stream settings.
camera_width: 848
camera_height: 480
camera_fps: 60

# Seconds to blend from the current command to a new follower target. 0 disables smoothing.
action_interpolation_duration_s: 0.0
# Follower command loop rate while action interpolation is enabled.
action_command_hz: 50.0

# Port for the viser server hosting the scene + robot point clouds and GUI controls.
viser_port: 8080
